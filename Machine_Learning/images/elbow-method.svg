<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Elbow method for K-Means</title>
  <desc id="desc">A plot of inertia decreasing as K increases, with an elbow around K equals 3.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}
    .axis{stroke:#111827;stroke-width:2}
    .grid{stroke:#e5e7eb}
    .curve{fill:none;stroke:#2563eb;stroke-width:4}
    .point{fill:#2563eb}
    .elbow{stroke:#dc2626;stroke-width:2;stroke-dasharray:6 5}
    .label{font-size:16px;font-weight:700}
    .small{font-size:13px}
  </style>
  <rect width="760" height="430" fill="#fff"/>
  <line class="axis" x1="85" y1="355" x2="690" y2="355"/>
  <line class="axis" x1="85" y1="355" x2="85" y2="55"/>
  <text class="label" x="385" y="405" text-anchor="middle">Number of clusters (K)</text>
  <text class="label" x="28" y="210" transform="rotate(-90 28 210)" text-anchor="middle">Inertia / WCSS</text>
  <path class="grid" d="M85 285H690M85 215H690M85 145H690M85 75H690"/>
  <path class="curve" d="M135 80 L215 150 L295 210 L375 242 L455 265 L535 282 L615 295"/>
  <circle class="point" cx="135" cy="80" r="6"/><circle class="point" cx="215" cy="150" r="6"/><circle class="point" cx="295" cy="210" r="7"/><circle class="point" cx="375" cy="242" r="6"/><circle class="point" cx="455" cy="265" r="6"/><circle class="point" cx="535" cy="282" r="6"/><circle class="point" cx="615" cy="295" r="6"/>
  <line class="elbow" x1="295" y1="210" x2="295" y2="355"/>
  <line class="elbow" x1="85" y1="210" x2="295" y2="210"/>
  <text class="label" x="340" y="195">Elbow around K = 3</text>
  <text class="small" x="350" y="218">After this point, improvement slows down</text>
</svg>
